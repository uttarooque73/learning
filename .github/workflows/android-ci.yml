name: Android CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle test --no-daemon

      - name: Android Lint
        run: gradle lintDebug --no-daemon

      - name: Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Release APK (unsigned CI validation)
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netguard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify signing secrets
        env:
          STORE: ${{ secrets.NETGUARD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NETGUARD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.NETGUARD_KEY_ALIAS }}
        run: |
          test -n "$STORE"
          test -n "$STORE_PASSWORD"
          test -n "$ALIAS"
          echo "All release signing secrets are present."

      - name: Decode release keystore
        env:
          NETGUARD_KEYSTORE_BASE64: ${{ secrets.NETGUARD_KEYSTORE_BASE64 }}
        run: |
          test -n "$NETGUARD_KEYSTORE_BASE64"
          echo "$NETGUARD_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore

      - name: Build signed release APK
        env:
          NETGUARD_KEYSTORE_PATH: release.keystore
          NETGUARD_KEYSTORE_PASSWORD: ${{ secrets.NETGUARD_KEYSTORE_PASSWORD }}
          NETGUARD_KEY_ALIAS: ${{ secrets.NETGUARD_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Verify release APK signing
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Prepare release APK
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "NetGuard-${GITHUB_REF_NAME}.apk"
          echo "Release APK: $APK_PATH"

      - name: Remove release keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: NetGuard-${{ github.ref_name }}.apk
